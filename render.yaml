services:
  - type: web
    name: wangui-beauty-bar-staging
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wangui-beauty-bar-staging-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: wangui-beauty-bar-staging-db
    databaseName: wangui_beauty_bar_stage
    user: wangui_app
    plan: free
    ipAllowList: []
