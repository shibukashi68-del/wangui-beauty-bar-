services:
  - type: web
    name: wangui-beauty-bar-staging
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
